pick_place_node:
  ros__parameters:
    arm_group: panda_arm
    hand_group: hand
    hand_frame: panda_hand

    # Named poses of the hand group, defined in the SRDF
    hand_open_pose: open
    hand_close_pose: close

    # Named pose of the arm group to return to after placing. Empty to skip.
    home_pose: ""

    planning_pipeline: ompl
    planner_id: ""

    # Grasp frame in the hand frame. Defaults are the values of the MTC
    # pick-and-place tutorial for the Panda hand.
    grasp_frame_xyz: [0.0, 0.0, 0.1]
    grasp_frame_rpy: [3.141592653589793, -1.5707963267948966, 0.0]
    grasp_angle_delta: 0.2617993877991494
    grasp_max_ik_solutions: 8

    approach_min_distance: 0.1
    approach_max_distance: 0.15
    lift_min_distance: 0.1
    lift_max_distance: 0.3
    retreat_min_distance: 0.1
    retreat_max_distance: 0.3

    planning_timeout: 5.0
    max_solutions: 5
    max_velocity_scaling: 0.5
    max_acceleration_scaling: 0.5
